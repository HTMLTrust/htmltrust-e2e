name: htmltrust

networks:
  htmltrust:
    driver: bridge

volumes:
  mongo-data:
  wp-db-data:
  wp-1-data:
  wp-2-data:
  wp-3-data:
  wp-4-data:
  wp-5-data:

services:

  mongodb:
    image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
    networks:
      - htmltrust
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  trust-directory-alpha:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.trust-server
    networks:
      - htmltrust
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017/htmltrust_alpha
      # Overridable per run, e.g.
      #   HTMLTRUST_DIRECTORY_ALPHA_GENERAL_API_KEY=$(openssl rand -hex 24) \
      #   HTMLTRUST_DIRECTORY_ALPHA_ADMIN_API_KEY=$(openssl rand -hex 24) docker compose up
      # (or the same two lines in htmltrust-e2e/.env, which compose reads).
      #
      # Scenario loading applies the same environment variables, so callers can
      # replace the checked-in simulation credentials for a run.
      GENERAL_API_KEY: ${HTMLTRUST_DIRECTORY_ALPHA_GENERAL_API_KEY:-sim_general_key}
      ADMIN_API_KEY: ${HTMLTRUST_DIRECTORY_ALPHA_ADMIN_API_KEY:-sim_admin_key}
      AUTHOR_API_KEY_PEPPER: ${HTMLTRUST_DIRECTORY_ALPHA_AUTHOR_API_KEY_PEPPER:-sim_author_api_key_pepper}
      # Signed key URLs must be reachable by a production-policy verifier,
      # which accepts HTTPS only. Nginx proxies this test hostname internally.
      DIRECTORY_BASE_URL: ${HTMLTRUST_DIRECTORY_ALPHA_PUBLIC_URL:-https://trust-a.htmltrust.test}
      # The Playwright phase represents 1,000 independent consumers from one
      # tools-container IP. Keep the limiters active with simulation-scale
      # ceilings; the server repository's production defaults remain 600
      # total and 60 writes per IP each minute.
      RATE_LIMIT_GLOBAL: ${HTMLTRUST_E2E_RATE_LIMIT_GLOBAL:-20000}
      RATE_LIMIT_WRITE: ${HTMLTRUST_E2E_RATE_LIMIT_WRITE:-10000}
      PORT: "3000"
    ports:
      # Loopback only. "3000:3000" publishes on 0.0.0.0, exposing the trust
      # directory API -- including the admin key's endpoints -- to anything
      # that can reach this machine.
      - "127.0.0.1:${HTMLTRUST_DIRECTORY_ALPHA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  trust-directory-beta:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.trust-server
    networks:
      - htmltrust
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017/htmltrust_beta
      GENERAL_API_KEY: ${HTMLTRUST_DIRECTORY_BETA_GENERAL_API_KEY:-sim_general_key}
      ADMIN_API_KEY: ${HTMLTRUST_DIRECTORY_BETA_ADMIN_API_KEY:-sim_admin_key}
      AUTHOR_API_KEY_PEPPER: ${HTMLTRUST_DIRECTORY_BETA_AUTHOR_API_KEY_PEPPER:-sim_beta_author_api_key_pepper}
      DIRECTORY_BASE_URL: ${HTMLTRUST_DIRECTORY_BETA_PUBLIC_URL:-https://trust-b.htmltrust.test}
      RATE_LIMIT_GLOBAL: ${HTMLTRUST_E2E_RATE_LIMIT_GLOBAL:-20000}
      RATE_LIMIT_WRITE: ${HTMLTRUST_E2E_RATE_LIMIT_WRITE:-10000}
      PORT: "3000"
    ports:
      - "127.0.0.1:${HTMLTRUST_DIRECTORY_BETA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  wp-db:
    image: mariadb:11@sha256:2439dcd7d14010ecd1ff7a4e1c5abe8e208c34fe35290744deeeaac3569043c3
    networks:
      - htmltrust
    volumes:
      - wp-db-data:/var/lib/mysql
      # Creates wp1..wp5 and scopes the `wordpress` account to them. See the
      # file for the one-time `docker compose down -v` note.
      - ./wp-db-init.sql:/docker-entrypoint-initdb.d/10-wp-users.sql:ro
    environment:
      # root stays reachable inside the compose network because
      # src/phases/infrastructure.ts and src/smoke-test.ts create the wp*
      # databases with the configured root password. Nothing else uses it,
      # and this service publishes no ports.
      MYSQL_ROOT_PASSWORD: ${WP_DB_ROOT_PASSWORD:-rootpass}
      # The unprivileged account the five WordPress containers connect as.
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${WP_DB_PASSWORD:-wp_sim_local_only}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wp-1:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.wordpress
    networks:
      - htmltrust
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_sim_local_only}
      WORDPRESS_DB_NAME: wp1
    volumes:
      - wp-1-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$headers=@get_headers('http://127.0.0.1/'); exit(is_array($$headers) && count($$headers) > 0 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wp-2:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.wordpress
    networks:
      - htmltrust
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_sim_local_only}
      WORDPRESS_DB_NAME: wp2
    volumes:
      - wp-2-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$headers=@get_headers('http://127.0.0.1/'); exit(is_array($$headers) && count($$headers) > 0 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wp-3:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.wordpress
    networks:
      - htmltrust
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_sim_local_only}
      WORDPRESS_DB_NAME: wp3
    volumes:
      - wp-3-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$headers=@get_headers('http://127.0.0.1/'); exit(is_array($$headers) && count($$headers) > 0 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wp-4:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.wordpress
    networks:
      - htmltrust
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_sim_local_only}
      WORDPRESS_DB_NAME: wp4
    volumes:
      - wp-4-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$headers=@get_headers('http://127.0.0.1/'); exit(is_array($$headers) && count($$headers) > 0 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  wp-5:
    build:
      context: ..
      dockerfile: htmltrust-e2e/Dockerfile.wordpress
    networks:
      - htmltrust
    depends_on:
      wp-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WP_DB_PASSWORD:-wp_sim_local_only}
      WORDPRESS_DB_NAME: wp5
    volumes:
      - wp-5-data:/var/www/html
    healthcheck:
      test: ["CMD", "php", "-r", "$$headers=@get_headers('http://127.0.0.1/'); exit(is_array($$headers) && count($$headers) > 0 ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Playwright container: runs on demand via `docker compose run playwright`
  # Resolves *.htmltrust.test via Docker DNS, no host state needed
  playwright:
    image: mcr.microsoft.com/playwright:v1.59.1-jammy@sha256:8a0360d39d1973be506dd59002904a774f6d697d4946c94063b3fd006461c8ff
    working_dir: /workspace
    user: "${HTMLTRUST_HOST_UID:-1000}:${HTMLTRUST_HOST_GID:-1000}"
    volumes:
      - .:/workspace
      - ../htmltrust-browser-reference/build/chromium:/extension:ro
      # npm records sibling file dependencies as relative symlinks. From
      # /workspace/node_modules those links resolve to these root paths.
      - ../htmltrust-browser-client:/htmltrust-browser-client:ro
      - ../htmltrust-canonicalization:/htmltrust-canonicalization:ro
    networks:
      - htmltrust
    environment:
      E2E_DIR: /workspace
      EXTENSION_PATH: /extension
      HOME: /tmp/htmltrust-home
      NPM_CONFIG_CACHE: /tmp/.npm
    # Override default command so the container stays idle; we launch scripts via `docker compose run`
    entrypoint: ["sleep", "infinity"]
    profiles: ["tools"]  # Only starts when explicitly requested

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    networks:
      htmltrust:
        aliases:
          - author1.htmltrust.test
          - author2.htmltrust.test
          - author3.htmltrust.test
          - author4.htmltrust.test
          - author5.htmltrust.test
          - author6.htmltrust.test
          - author7.htmltrust.test
          - author8.htmltrust.test
          - author9.htmltrust.test
          - author10.htmltrust.test
          - trust-a.htmltrust.test
          - trust-b.htmltrust.test
    depends_on:
      trust-directory-alpha:
        condition: service_healthy
      trust-directory-beta:
        condition: service_healthy
      wp-1:
        condition: service_healthy
      wp-2:
        condition: service_healthy
      wp-3:
        condition: service_healthy
      wp-4:
        condition: service_healthy
      wp-5:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # Loopback only. This fronts five WordPress installs whose admin
      # credentials are fixed sim values; publishing these ports to the whole
      # network the host is on.
      - "127.0.0.1:${HTMLTRUST_PROXY_PORT:-18080}:80"
      - "127.0.0.1:${HTMLTRUST_TLS_PROXY_PORT:-18443}:443"
    volumes:
      - ./.runtime/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./hugo-sites:/var/www/hugo:ro
