seed: 42
screenshot_sample_pct: 50

authors:
  count: 3
  cms_split:
    wordpress: 2
    hugo: 1
  articles_per_author: [2, 3]
  ai_metadata_distribution:
    None: 0.35
    "Human+AI": 0.35
    "AI-only": 0.30
  malicious_profiles:
    - malicious_pct: 0
      weight: 0.6
    - malicious_pct: 0.5
      weight: 0.2
    - malicious_pct: 1.0
      weight: 0.2

